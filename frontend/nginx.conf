server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend REST API — routes are already prefixed with /api in FastAPI
    # (see backend/src/Infrastructure/Api/Controller/*), so the prefix is
    # forwarded as-is, unlike a strip-prefix proxy.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP server (FastMCP, streamable HTTP) — used directly by external MCP
    # clients (Claude Desktop, Claude Code), not by the React app. Buffering
    # must stay off and the connection must be allowed to stay open, since
    # streamable HTTP keeps a long-lived request/response cycle open.
    location /mcp {
        proxy_pass http://backend:8000/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # RFC 9728 OAuth Protected Resource Metadata — discovered by MCP clients
    # before authenticating against Auth0.
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://backend:8000/.well-known/oauth-protected-resource;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }
}
