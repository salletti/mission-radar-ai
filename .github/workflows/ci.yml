name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff
        working-directory: backend
        run: ruff check src tests

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mission_radar
          POSTGRES_USER: mission_radar
          POSTGRES_PASSWORD: mission_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mission_radar -d mission_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://mission_radar:mission_radar@localhost:5432/mission_radar
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      APIFY_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements/dev.txt
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Start Celery worker (background — required by test_celery_ping.py)
        working-directory: backend
        run: |
          celery -A src.Infrastructure.Worker.celery_app worker --loglevel=info -Q default &
          sleep 5
      - name: Run unit tests
        working-directory: backend
        run: pytest tests/Unit/ -v
      - name: Run integration tests
        working-directory: backend
        run: pytest tests/Integration/ -v

  evaluation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements/base.txt
            evaluation/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r backend/requirements/base.txt
          pip install -r evaluation/requirements.txt
      - name: Run evaluation tests (fakes only — zero LLM calls, no API key needed)
        working-directory: evaluation
        run: pytest tests/ -v

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Run tests
        run: npx vitest run
